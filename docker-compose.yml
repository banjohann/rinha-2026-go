services:
  api-1:
    image: banjohann/rinha-2026-go:v5
    environment:
      LISTEN_ADDR: ":8000"
      DATA_DIR: /data
      GOGC: "75"
      GOMEMLIMIT: "150MiB"
      METRICS: "${METRICS:-}"
      PPROF: "${PPROF:-}"
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"

  api-2:
    image: banjohann/rinha-2026-go:v5
    environment:
      LISTEN_ADDR: ":8000"
      DATA_DIR: /data
      GOGC: "75"
      GOMEMLIMIT: "150MiB"
      METRICS: "${METRICS:-}"
      PPROF: "${PPROF:-}"
    networks:
      - rinha
    depends_on:
      - api-1
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: "160MB"

  haproxy:
    image: haproxy:2.9-alpine
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "9999:9999"
    depends_on:
      - api-1
      - api-2
    networks:
      - rinha
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: "30MB"

networks:
  rinha:
    driver: bridge
