global
    maxconn 4096
    daemon

defaults
    mode http
    timeout connect 2s
    timeout client  3s
    timeout server  3s
    option http-keep-alive
    http-reuse always
    option forwardfor

frontend in
    bind *:9999
    default_backend apis

backend apis
    balance roundrobin
    option httpchk GET /ready
    http-check expect status 200
    server api1 api-1:8000 check inter 2s fall 3 rise 1
    server api2 api-2:8000 check inter 2s fall 3 rise 1
